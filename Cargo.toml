[workspace]
resolver = "2"
members = ["crates/core", "crates/runtime", "crates/cli", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lawless-m/Whackford"

[workspace.dependencies]
wack-core = { path = "crates/core" }
wack-runtime = { path = "crates/runtime" }
wasm-encoder = "0.260"
wasmparser = "0.260"
wasmtime = { version = "49", default-features = false, features = ["cranelift", "runtime", "std", "gc", "gc-copying", "parallel-compilation", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
