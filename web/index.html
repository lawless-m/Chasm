<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whackford REPL</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #fbfbf8; --dim: #6b6b6b; --err: #b3261e; --ok: #1b6e3a; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e6e3; --bg: #161616; --dim: #9a9a9a; --err: #ff8a80; --ok: #8fd19e; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 ui-monospace, "DejaVu Sans Mono", monospace; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--dim); }
  #out { flex: 1; overflow: auto; margin: 0; white-space: pre-wrap; }
  .err { color: var(--err); } .stack { color: var(--ok); } .echo, .hint { color: var(--dim); }
  .line { display: flex; gap: 8px; align-items: flex-start; border-top: 1px solid var(--dim); padding-top: 8px; }
  textarea { flex: 1; resize: none; height: 2.9em; font: inherit; color: inherit; background: transparent; border: 0; outline: none; }
  .line.big textarea { height: 50vh; }
  #expand { font: inherit; color: var(--dim); background: transparent; border: 1px solid var(--dim); border-radius: 4px; padding: 0 6px; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Whackford REPL</h1>
  <p>Enter runs a chunk; an open <code>:</code> definition or <code>[</code> quotation continues on the next line. Shift+Enter adds a newline. <b>⤢</b> opens an editor: there Enter adds a newline, Ctrl+Enter runs and Esc closes it.</p>
  <pre id="out"></pre>
  <div class="line"><span id="prompt">&gt;</span><textarea id="in" rows="2" disabled spellcheck="false" autocomplete="off"></textarea><button id="expand" type="button" title="Editor: Enter adds a newline, Ctrl+Enter runs, Esc closes">⤢</button></div>
</main>
<script src="coi.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
