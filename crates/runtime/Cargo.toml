[package]
name = "wack-runtime"
description = "Whackford host runtime: I/O ring servicing, namespace, native wasmtime host."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["native"]
native = ["dep:wasmtime"]

[dependencies]
wack-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls"] }
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
wasmtime-wasi = { version = "49", default-features = false, features = ["p1"] }
