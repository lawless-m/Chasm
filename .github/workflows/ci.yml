name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Binaryen
        run: |
          curl -sSL -o binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  binaryen.tar.gz" | sha256sum -c
          tar xzf binaryen.tar.gz
          echo "$PWD/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - name: Test
        run: cargo test
      - name: Core builds for wasm32
        run: cargo build -p wack-core --target wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Web build
        run: sh web/build.sh
      - name: Web checks
        run: node web/test/compiler.mjs && node web/test/ring.mjs && node web/test/node-repl.mjs && node web/test/net.mjs && node web/test/node-structs.mjs && node web/test/node-procs.mjs && node web/test/node-examples.mjs
      - name: Examples
        run: |
          for f in examples/*.wack; do
            cargo run -q -p wack-cli -- test "$f"
          done
      - name: Markdown package
        run: python3 -m pip install markdown
      - name: Docs examples
        run: cargo build -p wack-cli && WACK=target/debug/wack python3 site/check.py
      - name: Site build
        run: WACK=target/debug/wack python3 site/build.py
